name: Validate chapel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -type f | head -1)" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapel-browser-evidence
          path: artifacts/
